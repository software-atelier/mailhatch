name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.3.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java and Maven credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Validate release tag and project version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release ref '$RELEASE_TAG' is not a Git tag." >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag '$RELEASE_TAG' does not point to checked-out commit '$head_commit'." >&2
            exit 1
          fi

          project_version="$(mvn help:evaluate \
            -Dexpression=project.version \
            -q -DforceStdout)"

          if [[ "$project_version" == *-SNAPSHOT ]]; then
            echo "Refusing to publish snapshot version: $project_version" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "v$project_version" ]]; then
            echo "Release tag '$RELEASE_TAG' must equal 'v$project_version'." >&2
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Pcentral clean deploy
